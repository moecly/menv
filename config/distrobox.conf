# ============================================================
# Distrobox Containers
# ============================================================
# format: name:image[:home_dir]
#   name:     container name
#   image:    container image (e.g. archlinux:latest, fedora:42)
#   home_dir: optional, empty = share host $HOME (default),
#             specify path for isolated home

DISTROBOX_CONTAINERS=(
    "arch:archlinux:latest"
)

DISTROBOX_EXPORT_PATH="${HOME}/.local/bin"
