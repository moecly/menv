# ============================================================
# Distrobox Containers
# ============================================================
# format: name:image[:home_dir]
#   name:     container name
#   image:    container image (e.g. archlinux:latest, fedora:42)
#   home_dir: optional, empty = $MOECLY_DIR/distrobox/<name> (default),
#             specify path to override

DISTROBOX_CONTAINERS=(
    "arch:archlinux:latest"
)

DISTROBOX_EXPORT_PATH="${MOECLY_DIR:-$HOME/.moecly_conf}/distrobox_bin"
