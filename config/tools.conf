# ============================================================
# Tools
# ============================================================
# format: target:pkg_mgr:export:category:type:package:commands:description
#   target:    root (host system) / container name (from config/distrobox.conf)
#   pkg_mgr:   pacman / aur / dnf / apt / snap / ...
#   export:    cli (export binary) / app (export desktop app) / none (container-only)
#              for root entries, export field is ignored (use "cli" as placeholder)
#   category:  English alias (see CATEGORY_ALIASES below)
#   type:      required / optional
#   package:   actual package name
#   commands:  space-separated commands for detection
#   description: Chinese description
#
# Examples:
#   root:pacman:cli:base:required:git:git:版本控制
#   root:aur:cli:tui:optional:lazydocker:lazydocker:容器管理 TUI
#   arch:pacman:cli:pkg:optional:npm:npm:Node.js 包管理器
#   arch:pacman:app:productivity:optional:libreoffice:libreoffice:办公套件
#   arch:aur:cli:pkg:optional:paru:paru:AUR 包管理器
#   ubuntu:snap:cli:pkg:optional:hello:hello:Snap 示例

